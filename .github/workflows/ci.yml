name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    name: TypeScript client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Compile only: the full build also publishes the SLAI start-up loader, which needs a SLAI checkout.
      - run: npx tsc -p tsconfig.build.json
  python:
    name: Python (without a SLAI checkout)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q slai
      # Tests that need the SLAI checkout (set SLAI_ROOT) report themselves as skipped here; they are not counted as passed.
      - run: python -m unittest discover -s tests_py -v
