name: Writer native vector export
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest reportlab Pillow python-docx pypdf
      - run: python -m compileall -q slai/docmodel/writers
      - run: python -m pytest tests_py/test_vector_shapes.py -v
