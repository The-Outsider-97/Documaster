[package]
name = "documaster"
version = "2.4.0"
description = "SLAI Documaster - word counter, converter, merger, page organiser, PDF editor and reader, with SLAI's agents and models built in"
authors = ["SLAI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "documaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
